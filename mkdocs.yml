site_name: T3CO 
site_description: Transportation Technology Total Cost of Ownership
repo_url: https://github.com/NREL/T3CO
edit_uri: https://github.com/NREL/T3CO/tree/main/docs
site_author: Harish Panneer Selvam 
docs_dir: docs/pages/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_if_no_docstring: true
            docstring_options:
              ignore_init_summary: false
            merge_init_into_class: false
            heading_level: 2
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_root_toc_entry: true 
            annotations_path: source
            show_signature: true
            separate_signature: false
            show_signature_annotations: true
            unwrap_annotated: true

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences


theme:
  name: material
  favicon: t3co_logo.svg
  highlightjs: true
  hljs_languages:
    - python
    - yaml
  features:
    - search.highlight
    - content.action.view
    - search.suggest
    - content.code.copy
    - navigation.path
    - content.tooltips

  icon:
    repo: fontawesome/brands/github
    edit: material/pencil 
    view: material/eye

nav:
    - Home: index.md
    - Installation: installation.md
    - Quick Start: quick_start.md
    - Overview: T3CO_Overview.md
    - Inputs: 
      - Vehicle: vehicle_inputs_descriptions.md
      - Scenario: scenario_inputs_descriptions.md
      - Config: config_inputs_descriptions.md
    - Results:
      - Outputs: t3co_outputs_descriptions.md
    - API Reference: 
      - Input Data SubModules:
        - Vehicle: vehicle.md
        - Scenario: scenario.md
        - Config: config.md  
      - Energy SubModules:
        - Energy: energy.md
        - FASTSim Wrapper: fastsim_wrapper.md
      - Cost SubModules:
        - Capital Costs: capital_costs.md
        - Operating Costs: operating_costs.md
        - Opportunity Costs: opportunity_costs.md
      - TCO SubModules:
        - TCO Calc Per Year: tcocalc.md
        - Ledger: ledger.md
      - CLI SubModules:
        - Sweep: sweep.md
      - Utility SubModules:
        - Demo Files Installer: demo_files_installer.md
        - Print Class Objects: print_class_objects.md